# SPDX-License-Identifier: MIT

# Scans new and edited issues, discussions and comments against the private denylist. It never
# comments and its log never says whether anything matched. On a match it opens a draft
# security advisory, which only maintainers can see.

name: Scan posts

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/hygiene/scan-discussion.mjs
        env:
          WIRELITH_DENYLIST: ${{ secrets.WIRELITH_DENYLIST }}
          WIRELITH_TRIAGE_TOKEN: ${{ secrets.WIRELITH_TRIAGE_TOKEN }}
