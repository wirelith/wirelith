# SPDX-License-Identifier: MIT

# Checks on a pull request's metadata and content: the checklist, commit identities and
# sign-offs, the copyright holder's name, and the private denylist.
#
# This runs on pull_request_target, so that the denylist job can read its secret. It runs the
# scripts from the base branch and reads the pull request only through the API, as data. It
# never checks out or runs code from the pull request.

name: PR checks

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/hygiene/check-pr-body.mjs

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/hygiene/check-commits.mjs --github-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

  holder-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/hygiene/check-holder.mjs --github-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

  denylist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/hygiene/denylist.mjs --github-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WIRELITH_DENYLIST: ${{ secrets.WIRELITH_DENYLIST }}
