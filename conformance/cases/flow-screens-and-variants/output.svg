<svg xmlns="http://www.w3.org/2000/svg" width="1426" height="1860" viewBox="0 0 1426 1860" role="img" aria-labelledby="wl-title wl-desc" xml:space="preserve"><title id="wl-title">4 screens</title><desc id="wl-desc">Screens: Cart, Shipping, Shipping, Done. 4 links.</desc><metadata><wl:source xmlns:wl="urn:wirelith:source" version="0.1">screen "Cart" phone #cart
  button "Checkout" primary -&gt; #ship "Next"
screen "Shipping" phone #ship
  input "Postcode"
  button "Continue" primary -&gt; #done
  link "Back" -&gt; #cart
screen "Shipping" #ship-error of=#ship state="Invalid postcode"
  input "Postcode" error="Enter a valid postcode"
screen "Done" phone #done
  h1 "Order placed"
flow #done -&gt; #cart "Start again"
</wl:source></metadata><defs><clipPath id="wl-cart-clip"><rect x="0" y="0" width="390" height="844" rx="6"/></clipPath><clipPath id="wl-ship-clip"><rect x="0" y="0" width="390" height="844" rx="6"/></clipPath><clipPath id="wl-ship-error-clip"><rect x="0" y="0" width="390" height="844" rx="6"/></clipPath><clipPath id="wl-done-clip"><rect x="0" y="0" width="390" height="844" rx="6"/></clipPath><marker id="wl-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#6b7280"/></marker></defs><rect x="0" y="0" width="1426" height="1860" fill="#f4f5f7"/><g id="wl-cart" class="wl-screen" transform="translate(32 76)"><title>Cart</title><text x="0" y="-13" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#22262b">Cart</text><rect x="0" y="0" width="390" height="844" rx="6" fill="#ffffff"/><g clip-path="url(#wl-cart-clip)"><g id="wl-n1" class="wl-button wl-primary"><rect x="16" y="16" width="358" height="36" rx="6" fill="#2c3138" stroke="#2c3138" stroke-width="1.5"/><text x="160" y="41" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Checkout</text></g></g><rect x="0" y="0" width="390" height="844" rx="6" fill="none" stroke="#9aa1ab" stroke-width="1.5"/></g><g id="wl-ship" class="wl-screen" transform="translate(518 76)"><title>Shipping</title><text x="0" y="-13" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#22262b">Shipping</text><rect x="0" y="0" width="390" height="844" rx="6" fill="#ffffff"/><g clip-path="url(#wl-ship-clip)"><g id="wl-n3" class="wl-input"><text x="16" y="31" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#22262b">Postcode</text><rect x="16" y="38" width="358" height="40" rx="6" fill="#ffffff" stroke="#9aa1ab" stroke-width="1.5"/></g><g id="wl-n4" class="wl-button wl-primary"><rect x="16" y="94" width="358" height="36" rx="6" fill="#2c3138" stroke="#2c3138" stroke-width="1.5"/><text x="162" y="119" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Continue</text></g><g id="wl-n5" class="wl-link"><text x="16" y="164" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#2c3138">Back</text><line x1="16" y1="166" x2="51" y2="166" stroke="#2c3138" stroke-width="1"/></g></g><rect x="0" y="0" width="390" height="844" rx="6" fill="none" stroke="#9aa1ab" stroke-width="1.5"/></g><g id="wl-ship-error" class="wl-screen" transform="translate(518 984)"><title>Shipping (Invalid postcode)</title><text x="0" y="-13" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#22262b">Shipping (Invalid postcode)</text><rect x="0" y="0" width="390" height="844" rx="6" fill="#ffffff"/><g clip-path="url(#wl-ship-error-clip)"><g id="wl-n7" class="wl-input"><text x="16" y="31" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#22262b">Postcode</text><rect x="16" y="38" width="358" height="40" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/><text x="16" y="97" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#b42318">Enter a valid postcode</text></g></g><rect x="0" y="0" width="390" height="844" rx="6" fill="none" stroke="#9aa1ab" stroke-width="1.5"/></g><g id="wl-done" class="wl-screen" transform="translate(1004 76)"><title>Done</title><text x="0" y="-13" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#22262b">Done</text><rect x="0" y="0" width="390" height="844" rx="6" fill="#ffffff"/><g clip-path="url(#wl-done-clip)"><g id="wl-n9" class="wl-h1"><text x="16" y="51" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#22262b">Order placed</text></g></g><rect x="0" y="0" width="390" height="844" rx="6" fill="none" stroke="#9aa1ab" stroke-width="1.5"/></g><g class="wl-arrow"><path d="M406 110L446 110L446 124L518 124" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#wl-arrow)"/><rect x="436.5" y="115" width="37" height="18" rx="3" fill="#f4f5f7"/><text x="440.5" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#22262b">Next</text></g><g class="wl-arrow"><path d="M892 188L940 188L940 124L1004 124" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#wl-arrow)"/></g><g class="wl-arrow"><path d="M534 233L470 233L470 124L422 124" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#wl-arrow)"/></g><g class="wl-arrow"><path d="M1004 498L972 498L972 32L494 32L494 124L422 124" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#wl-arrow)"/><rect x="862.5" y="23" width="75" height="18" rx="3" fill="#f4f5f7"/><text x="866.5" y="38" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#22262b">Start again</text></g></svg>
