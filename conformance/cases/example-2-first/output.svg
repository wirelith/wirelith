<svg xmlns="http://www.w3.org/2000/svg" width="940" height="940" viewBox="0 0 940 940" role="img" aria-labelledby="wl-title wl-desc" xml:space="preserve"><title id="wl-title">2 screens</title><desc id="wl-desc">Screens: Sign in, Home. 1 link.</desc><metadata><wl:source xmlns:wl="urn:wirelith:source" version="0.1">wirelith 0.1

screen "Sign in" phone #signin
  h1 "Welcome back"
  input "Email" placeholder="you@example.com"
  input "Password" type=password
  button "Sign in" primary -&gt; #home
  link "Forgot your password?"

screen "Home" phone #home
  h1 "Hello, Sam"
  text "You have 3 new messages."
