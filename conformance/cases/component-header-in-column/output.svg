<svg xmlns="http://www.w3.org/2000/svg" width="1830" height="940" viewBox="0 0 1830 940" role="img" aria-labelledby="wl-title wl-desc" xml:space="preserve"><title id="wl-title">2 screens</title><desc id="wl-desc">Screens: Inbox, Shipping. 0 links.</desc><metadata><wl:source xmlns:wl="urn:wirelith:source" version="0.1">wirelith 0.1

screen "Inbox" desktop
  row grow
    sidebar
      nav [Inbox, Sent, Drafts] vertical active="Inbox"
    column grow pad=lg
      header
        h2 "Inbox"
        spacer
        input placeholder="Search" type=search width=240
        button "Compose" primary
      table [From, Subject, Received]
        row [Ada Park, Quarterly plan, Today]
        row [Luis Ortega, Room booking, Yesterday]

screen "Shipping" phone
  column pad=md gap=md
    header gap=sm
      button icon=arrow-left
      h3 "Shipping"
    input "Full name"
    input "Postcode"
    button "Continue" primary width=fill
