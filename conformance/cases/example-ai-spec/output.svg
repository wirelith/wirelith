<svg xmlns="http://www.w3.org/2000/svg" width="4360" height="896" viewBox="0 0 4360 896" role="img" aria-labelledby="wl-title wl-desc" xml:space="preserve"><title id="wl-title">2 screens</title><desc id="wl-desc">Screens: Projects, Website redesign. 2 links.</desc><metadata><wl:source xmlns:wl="urn:wirelith:source" version="0.1">wirelith 0.1

screen "Projects" desktop #projects
  header
    h2 "Projects"
    spacer
    input placeholder="Search" type=search width=240
    button "New project" primary #add -&gt; #new
  tabs [Active, Archived] active="Active"
    table [Name, Owner, Updated]
      row [Website redesign, Ada Park, 2 days ago]
      row [Mobile app, Luis Ortega, Last week]
  modal "New project" #new
    input "Name" required
    select "Template" [Blank, Roadmap, Launch plan]
    row justify=end
      button "Cancel"
      button "Create" primary -&gt; #detail
  note "Only admins see this button" for=#add

screen "Website redesign" desktop #detail
  breadcrumbs [Projects, Website redesign]
  h1 "Website redesign"
  empty "No tasks yet"
    button "Add a task" primary
