<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="800" viewBox="0 0 1544 800" role="img" aria-labelledby="wl-title wl-desc" xml:space="preserve"><title id="wl-title">Settings</title><desc id="wl-desc">Screens: Settings. 0 links.</desc><metadata><wl:source xmlns:wl="urn:wirelith:source" version="0.1">wirelith 0.1

screen "Settings" desktop #settings
  header
    h2 "Settings"
  tabs [Profile, Notifications, Billing] active="Notifications"
    card "Email"
      toggle "Product updates" on
      toggle "Weekly summary" on
      toggle "Comments on my work"
    card "Push"
      toggle "Mentions" on
      toggle "Reminders"
      select "Quiet hours" [Off, Nights, Nights and weekends] value="Nights"
    row justify=end
      button "Cancel"
      button "Save changes" primary #save
  note "Save stays disabled until something changes" for=#save
