[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "wirelith"
version = "0.1.0"
description = "A parser and validator for Wirelith, a plain-text language for low-fidelity wireframes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wirelith"]

# The repository's LICENSE and NOTICE travel with the package. They aren't copied into this folder,
# because the copyright holder's name may appear in the repository only in the root files.
[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "wirelith/LICENSE"
"../../NOTICE" = "wirelith/NOTICE"

[tool.hatch.build.targets.sdist]
include = ["src/wirelith", "tests", "scripts", "README.md"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
